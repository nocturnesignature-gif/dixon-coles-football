name: Performance backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download match data
        run: python scripts/download_data.py

      - name: Run global backtest
        run: python scripts/backtest.py

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest_metrics.json reports/backtest_predictions.csv
          if git diff --staged --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "Update performance backtest reports"
            git push
          fi
