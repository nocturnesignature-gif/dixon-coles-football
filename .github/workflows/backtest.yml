name: Performance backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download match data
        run: python scripts/download_data.py

      - name: Run global backtest
        run: python scripts/backtest.py

      - name: Inspect generated reports
        run: |
          find reports -maxdepth 2 -type f -print
          test -f reports/backtest_metrics.json
          test -f reports/backtest_predictions.csv

      - name: Upload backtest reports
        uses: actions/upload-artifact@v4
        with:
          name: backtest-reports
          path: reports/
          if-no-files-found: error

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports/
          if git diff --staged --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git commit -m "Update performance backtest reports"
          git fetch origin main
          git rebase origin/main
          git push
