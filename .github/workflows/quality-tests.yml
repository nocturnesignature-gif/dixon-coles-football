name: Prediction quality tests
on:
  push:
    branches: [main]
    paths:
      - 'api/quality.py'
      - 'tests/test_quality_api.py'
      - '.github/workflows/quality-tests.yml'
  pull_request:
    paths:
      - 'api/quality.py'
      - 'tests/test_quality_api.py'
      - '.github/workflows/quality-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'Flask>=3,<4'
      - name: Run quality API unit tests
        run: python -m unittest discover -s tests -p 'test_quality_api.py' -v
