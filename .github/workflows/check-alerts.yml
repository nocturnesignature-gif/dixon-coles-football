name: Check value alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Check high-value betting alerts
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://paris-predictions.vercel.app' }}
        run: |
          response=$(curl -sS --fail --max-time 120 \
            -w '\n%{http_code}' \
            "$APP_URL/api/check-alerts")
          echo "$response"
          status=$(echo "$response" | tail -n 1)
          if [ "$status" != "200" ]; then
            echo "Alert check failed with HTTP $status"
            exit 1
          fi
