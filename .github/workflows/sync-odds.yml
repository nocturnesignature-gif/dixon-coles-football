name: Sync live odds

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call odds synchronization endpoint
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://paris-predictions.vercel.app' }}
        run: |
          response=$(curl -sS --fail --max-time 120 \
            -w '\n%{http_code}' \
            "$APP_URL/api/sync-odds")
          echo "$response"
          status=$(echo "$response" | tail -n 1)
          if [ "$status" != "200" ]; then
            echo "Odds synchronization failed with HTTP $status"
            exit 1
          fi
